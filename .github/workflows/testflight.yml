name: iPhone TestFlight
on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/testflight.yml'
  push:
    tags:
      - 'kura-testflight-*'

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

jobs:
  archive:
    name: Check iPhone distribution archive
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Determine build number
        id: version
        shell: bash
        run: |
          set -euo pipefail
          build=1
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^kura-testflight-([1-9][0-9]{0,3})$ ]] || {
              echo "Use a kura-testflight tag with a build number from 1 to 9999." >&2
              exit 1
            }
            build=${BASH_REMATCH[1]}
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Archive for a physical iPhone
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          xcodebuild -version
          archive="$RUNNER_TEMP/Kura.xcarchive"
          xcodebuild -quiet -project ios/Kura.xcodeproj -scheme Kura -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$archive" \
            -derivedDataPath "$RUNNER_TEMP/build" -onlyUsePackageVersionsFromResolvedFile \
            KURA_BUILD_NUMBER="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO archive
          python3 ios/ci/verify-archive.py "$archive" app.kura.wallet "$BUILD_NUMBER"
  upload:
    name: Upload to TestFlight
    needs: archive
    if: github.event_name == 'push' && github.event.deleted == false && startsWith(github.ref, 'refs/tags/kura-testflight-')
    environment: testflight
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Sign and upload the reviewed build
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          TESTFLIGHT_BUILD_NUMBER: ${{ needs.archive.outputs.build }}
        run: bash ios/ci/upload-testflight.sh
