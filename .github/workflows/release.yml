name: Unsigned Android release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build unsigned GitHub APK
        run: ./gradlew -PcardScanner=true -PdirectUpdates=true :app:assembleRelease --max-workers=2 --console=plain
      - name: Verify release packaging
        run: python3 tools/verify-native-packaging.py --card-scanner --direct-updates
      - uses: actions/upload-artifact@v4
        with:
          name: Kura-unsigned-release-candidate
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
