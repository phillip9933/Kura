name: Unsigned Android release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          packages: platform-tools
      - run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          command -v apkanalyzer > /dev/null
      - name: Build unsigned GitHub APK
        run: ./gradlew -PcardScanner=true -PdirectUpdates=true :app:assembleRelease --max-workers=2 --console=plain
      - name: Verify release packaging
        run: python3 tools/verify-native-packaging.py --card-scanner --direct-updates
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Kura-unsigned-release-candidate
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
