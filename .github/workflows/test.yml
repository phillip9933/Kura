name: Android verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      export-prototype-apks:
        description: Export prototype and core-test APKs for disposable-emulator acceptance
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {direct-updates: false, card-scanner: false}
          - {direct-updates: true, card-scanner: false}
          - {direct-updates: false, card-scanner: true}
          - {direct-updates: true, card-scanner: true}
    env:
      DIRECT_UPDATES: ${{ matrix.direct-updates }}
      CARD_SCANNER: ${{ matrix.card-scanner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          packages: platform-tools
      - name: Install Android build tools
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          command -v apkanalyzer > /dev/null
      - name: Packaging verifier regressions
        if: ${{ !matrix.direct-updates && !matrix.card-scanner }}
        run: python3 -m unittest discover -s tools/tests -p 'test_verify_native_packaging.py' -v
      - name: Unit tests, lint and unsigned build
        run: ./gradlew :core:model:test :core:import:testDebugUnitTest :core:import:testLowMemory :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest -PdirectUpdates=$DIRECT_UPDATES -PcardScanner=$CARD_SCANNER --max-workers=2 --console=plain
      - name: Verify permissions and 16 KiB packaging
        run: |
          args=()
          if [ "$DIRECT_UPDATES" = "true" ]; then args+=(--direct-updates); fi
          if [ "$CARD_SCANNER" = "true" ]; then args+=(--card-scanner); fi
          python3 tools/verify-native-packaging.py "${args[@]}"
      - name: Record resolved runtime and build dependencies
        run: ./gradlew -I tools/export-dependency-resolution.gradle exportDependencyResolution -PdirectUpdates=$DIRECT_UPDATES -PcardScanner=$CARD_SCANNER -PkuraSourceRevision=${{ github.event.pull_request.head.sha || github.sha }} --max-workers=2 --console=plain
      - name: Build supplemental runtime acceptance APKs
        if: github.event_name == 'workflow_dispatch' && inputs.export-prototype-apks && matrix.direct-updates && matrix.card-scanner
        run: ./gradlew :core:security:assembleDebugAndroidTest :core:database:assembleDebugAndroidTest :core:import:assembleDebugAndroidTest :app:assembleOptimized :benchmark:assembleDebugAndroidTest -PdirectUpdates=$DIRECT_UPDATES -PcardScanner=$CARD_SCANNER --max-workers=2 --console=plain
      - name: Export prototype and core-test APKs
        if: github.event_name == 'workflow_dispatch' && inputs.export-prototype-apks && matrix.direct-updates && matrix.card-scanner
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kura-prototype-runtime-apks
          retention-days: 7
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/outputs/apk/optimized/app-optimized.apk
            benchmark/build/outputs/apk/androidTest/debug/*.apk
            core/security/build/outputs/apk/androidTest/debug/*.apk
            core/database/build/outputs/apk/androidTest/debug/*.apk
            core/import/build/outputs/apk/androidTest/debug/*.apk
      - name: Compile opt-in installer acceptance harness
        if: matrix.direct-updates && matrix.card-scanner
        run: ./gradlew -PdirectUpdates=true -PcardScanner=true -PinstallerAcceptance=true :app:assembleDebugAndroidTest --max-workers=2 --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-verification-reports-updates-${{ matrix.direct-updates }}-scanner-${{ matrix.card-scanner }}
          path: |
            **/build/reports/
            **/build/test-results/
