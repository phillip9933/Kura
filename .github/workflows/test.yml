name: Android verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Unit tests, lint and unsigned build
        run: ./gradlew :core:model:test :core:import:testDebugUnitTest :core:import:testLowMemory :app:lintDebug :app:assembleDebug :app:assembleRelease --max-workers=2 --console=plain
      - name: Verify offline release and 16 KiB packaging
        run: python3 verify-native-packaging.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification-reports
          path: |
            **/build/reports/
            **/build/test-results/
