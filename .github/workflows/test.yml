name: Android verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {direct-updates: false, card-scanner: false}
          - {direct-updates: true, card-scanner: false}
          - {direct-updates: false, card-scanner: true}
          - {direct-updates: true, card-scanner: true}
    env:
      DIRECT_UPDATES: ${{ matrix.direct-updates }}
      CARD_SCANNER: ${{ matrix.card-scanner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Unit tests, lint and unsigned build
        run: ./gradlew :core:model:test :core:import:testDebugUnitTest :core:import:testLowMemory :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest -PdirectUpdates=$DIRECT_UPDATES -PcardScanner=$CARD_SCANNER --max-workers=2 --console=plain
      - name: Verify permissions and 16 KiB packaging
        run: |
          args=()
          if [ "$DIRECT_UPDATES" = "true" ]; then args+=(--direct-updates); fi
          if [ "$CARD_SCANNER" = "true" ]; then args+=(--card-scanner); fi
          python3 tools/verify-native-packaging.py "${args[@]}"
      - name: Compile opt-in installer acceptance harness
        if: matrix.direct-updates && matrix.card-scanner
        run: ./gradlew -PdirectUpdates=true -PcardScanner=true -PinstallerAcceptance=true :app:assembleDebugAndroidTest --max-workers=2 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification-reports-updates-${{ matrix.direct-updates }}-scanner-${{ matrix.card-scanner }}
          path: |
            **/build/reports/
            **/build/test-results/
