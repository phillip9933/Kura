name: Android verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        direct-updates: [false, true]
    env:
      DIRECT_UPDATES: ${{ matrix.direct-updates }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Unit tests, lint and unsigned build
        run: ./gradlew :core:model:test :core:import:testDebugUnitTest :core:import:testLowMemory :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest -PdirectUpdates=$DIRECT_UPDATES --max-workers=2 --console=plain
      - name: Verify permissions and 16 KiB packaging
        run: |
          if [ "$DIRECT_UPDATES" = "true" ]; then
            python3 tools/verify-native-packaging.py --direct-updates
          else
            python3 tools/verify-native-packaging.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification-reports-${{ matrix.direct-updates }}
          path: |
            **/build/reports/
            **/build/test-results/
